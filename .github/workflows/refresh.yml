name: お品書きの自動更新

# 3時間おきに X を再クロールし、判定・検証を通してからデータをコミットする。
# push されると Vercel が自動でビルドして公開する。
#
# 重要: 検証（verify-attribution / verify-site）が1つでも落ちたら
# コミットしない。担保が破れたデータが公開されることはない。

on:
  schedule:
    # 3時間おき（UTC）。日本時間では 0,3,6,9,12,15,18,21 時ごろ
    - cron: '10 */3 * * *'
  workflow_dispatch:
    inputs:
      skip_crawl:
        description: クロールを飛ばして再判定だけ行う
        required: false
        default: false
        type: boolean

# 同時に走らせない。前の実行が終わるまで待つ
concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Chromium を入れる
        run: npx playwright install --with-deps chromium

      - name: セッションを復元
        if: inputs.skip_crawl != true
        env:
          X_STORAGE_STATE_B64: ${{ secrets.X_STORAGE_STATE_B64 }}
        run: |
          if [ -z "$X_STORAGE_STATE_B64" ]; then
            echo "Secret X_STORAGE_STATE_B64 が設定されていません" >&2
            exit 1
          fi
          mkdir -p secrets
          printf '%s' "$X_STORAGE_STATE_B64" | base64 -d > secrets/x-storage-state.json
          node -e "JSON.parse(require('fs').readFileSync('secrets/x-storage-state.json','utf8'))"

      - name: 公式出店者一覧を取得
        run: npx tsx scripts/scrape-official.ts

      - name: X をクロール
        if: inputs.skip_crawl != true
        # --stale-hours 12: 前回の巡回から12時間経ったアカウントだけを見に行く。
        # 3時間おきに163アカウント全部を回すと1日1300回のアクセスになり
        # 凍結を招く。この指定なら1回あたり1/4程度に分散しつつ、
        # どのアカウントも1日2回は確認できる。
        # --max-minutes 35: 時間切れになる前に自分で切り上げて進捗を保存する。
        # ジョブが強制終了すると進捗がコミットされず、次回も最初から巡回する
        # ことになって永久に終わらない。切り上げれば実行ごとに前へ進む。
        run: npx tsx scripts/crawl-x.ts --stale-hours 12 --max-minutes 35

      - name: スコアと会場帰属を再計算
        run: npx tsx scripts/rescore.ts

      - name: 画像判別の結果を取り込む
        run: npx tsx scripts/apply-image-reads.ts || echo "読み取り結果がまだありません"

      - name: 会場帰属を検証（データ層）
        run: npx tsx scripts/verify-attribution.ts

      - name: ビルド
        # 投稿が増えてサークルページ314件を書き出すと既定のヒープでは足りず、
        # code 134（SIGABRT）で落ちる。手元で実際に落ちたので明示して広げる。
        # Vercel 側のビルドも同様なので vercel.json でも指定してある。
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run build

      - name: 掲載内容を検証（表示層）
        run: npx tsx scripts/verify-site.ts

      - name: 掲載状況を記録
        run: npx tsx scripts/coverage.ts >> "$GITHUB_STEP_SUMMARY"

      - name: セッションを消す
        if: always()
        run: rm -f secrets/x-storage-state.json

      - name: 変更があればコミットして push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # crawl-state.json も含める。次回の実行が「前回いつ巡回したか」を
          # 引き継げないと、毎回全件を巡回してしまう。
          git add data/
          if git diff --cached --quiet; then
            echo "新しいお品書きはありませんでした" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "お品書きの自動更新 $(date -u '+%Y-%m-%d %H:%M UTC')"

          # push は失敗しうる。1回のクロールに30〜45分かかるので、その間に
          # 人が push すると remote が進み `! [rejected] (fetch first)` で落ちる。
          # 実際 2026-08-08 13:10 UTC の回がこれで失敗し、47分かけて集めた
          # データを丸ごと捨てていた。次の回まで3時間、更新が止まる。
          #
          # data/ は生成物で、こちらが持っているのは常に新しい方
          # （remote 側の更新も自分の crawl-state.json に反映済み）。
          # rebase して積み直せばよい。競合したら自分の版を採る。
          for i in 1 2 3; do
            if git push; then
              echo "データを更新しました。Vercel が自動でビルドします。" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "push が弾かれました（$i 回目）。rebase して積み直します。"
            git pull --rebase -X ours || git rebase --abort
            sleep 5
          done
          echo "::error::3回試しても push できませんでした"
          exit 1
